<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abrir link em várias páginas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --fg: #1e293b;
  --bar: #94a3b8;
  --cell: #000;
  --line: #e2e8f0;
  --accent: #6366f1;
  --accent-hover: #4f46e5;
  --card-bg: #ffffff;
  --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 20px 60px -15px rgba(0, 0, 0, 0.15);
  --gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --radius: 16px;
  --radius-lg: 24px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px)
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f172a;
    --fg: #f1f5f9;
    --bar: #475569;
    --line: #334155;
    --card-bg: #1e293b;
    --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 20px 60px -15px rgba(0, 0, 0, 0.6)
  }
}

:root[data-theme="dark"] {
  --bg: #0f172a;
  --fg: #f1f5f9;
  --bar: #475569;
  --line: #334155;
  --card-bg: #1e293b;
  --shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 20px 60px -15px rgba(0, 0, 0, 0.6)
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0
}

html {
  scroll-padding-top: env(safe-area-inset-top, 0px)
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden
}

[hidden] {
  display: none !important
}

/* Home Section */
.home {
  max-width: 640px;
  margin: 0 auto;
  padding: 80px 24px;
  text-align: center;
  animation: fadeIn 0.6s ease-out
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px)
  }
  to {
    opacity: 1;
    transform: translateY(0)
  }
}

/* Card Principal */
.card {
  display: inline-block;
  background: var(--gradient);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 48px 56px;
  font-size: clamp(20px, 5vw, 28px);
  font-weight: 600;
  line-height: 1.4;
  margin-bottom: 40px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden
}

.card::before {
  content: '';
  position: absolute;
  top: -50%;
  right: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
  animation: shimmer 3s infinite
}

@keyframes shimmer {
  0%, 100% {
    transform: translate(0, 0)
  }
  50% {
    transform: translate(-25%, -25%)
  }
}

/* Formulário */
form {
  background: var(--card-bg);
  border-radius: var(--radius-lg);
  padding: 40px 32px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
  transition: transform 0.3s ease, box-shadow 0.3s ease
}

form:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg)
}

/* Input Principal */
.link {
  width: 100%;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  text-align: center;
  padding: 18px 20px;
  border-radius: var(--radius);
  transition: all 0.3s ease
}

.link::placeholder {
  color: var(--bar);
  opacity: 1
}

.link:hover {
  border-color: var(--accent)
}

.link:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1)
}

/* Linha de Controles */
.row {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  margin-top: 24px;
  flex-wrap: wrap
}

label {
  font-weight: 500;
  font-size: 15px;
  color: var(--bar)
}

/* Quantidade */
.qtd {
  width: 90px;
  border: 2px solid var(--line);
  background: var(--bg);
  color: var(--fg);
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  padding: 12px;
  text-align: center;
  border-radius: var(--radius);
  transition: all 0.3s ease
}

.qtd:hover {
  border-color: var(--accent)
}

.qtd:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1)
}

/* Botões */
.btn {
  border: none;
  background: var(--accent);
  color: #fff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  padding: 13px 32px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.2);
  transform: translate(-50%, -50%);
  transition: width 0.6s ease, height 0.6s ease
}

.btn:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px -8px rgba(99, 102, 241, 0.5)
}

.btn:hover::before {
  width: 300px;
  height: 300px
}

.btn:active {
  transform: translateY(0)
}

.btn.alt {
  background: transparent;
  color: var(--fg);
  border: 2px solid var(--line);
  font-weight: 500
}

.btn.alt:hover {
  background: var(--bg);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: none
}

.btn:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px
}

/* Mensagem de Erro */
.err {
  min-height: 24px;
  margin-top: 16px;
  color: #ef4444;
  font-size: 14px;
  font-weight: 500;
  animation: shake 0.5s ease
}

@keyframes shake {
  0%, 100% {
    transform: translateX(0)
  }
  25% {
    transform: translateX(-5px)
  }
  75% {
    transform: translateX(5px)
  }
}

/* View Section */
#view {
  animation: fadeIn 0.4s ease-out
}

/* Barra de Controles */
.bar {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  padding: 20px 24px;
  font-size: 14px;
  background: var(--card-bg);
  border-bottom: 1px solid var(--line)
}

.bar .info {
  flex: 1;
  min-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 500;
  color: var(--bar)
}

.bar .btn {
  padding: 10px 20px;
  font-size: 14px
}

/* Mensagem de Ajuda */
.bar + p.bar {
  padding-top: 0;
  background: transparent;
  border: none;
  opacity: 0.75;
  font-size: 13px;
  color: var(--bar);
  padding: 12px 24px
}

/* Grid de Páginas */
.grid {
  display: grid;
  grid-template-columns: repeat(9, 1fr);
  gap: 12px;
  padding: 24px;
  background: var(--bg)
}

@media (max-width: 1024px) {
  .grid {
    grid-template-columns: repeat(6, 1fr)
  }
}

@media (max-width: 768px) {
  .grid {
    grid-template-columns: repeat(4, 1fr)
  }
}

@media (max-width: 480px) {
  .grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    padding: 16px
  }

  .home {
    padding: 40px 16px
  }

  .card {
    padding: 32px 24px
  }

  form {
    padding: 24px 20px
  }
}

/* Células do Grid */
.cell {
  background: var(--cell);
  aspect-ratio: 2 / 1;
  overflow: hidden;
  position: relative;
  border-radius: 8px;
  box-shadow: 0 4px 12px -4px rgba(0, 0, 0, 0.3);
  transition: transform 0.3s ease, box-shadow 0.3s ease
}

.cell:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
  z-index: 1
}

.cell iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 1280px;
  height: 640px;
  border: 0;
  background: #fff;
  transform: scale(var(--s, .1));
  transform-origin: 0 0
}

/* Animação de Loading */
@keyframes pulse {
  0%, 100% {
    opacity: 1
  }
  50% {
    opacity: 0.5
  }
}

.loading .cell::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--bar);
  animation: pulse 1.5s infinite;
  z-index: 1
}

/* Scrollbar Personalizada */
::-webkit-scrollbar {
  width: 12px;
  height: 12px
}

::-webkit-scrollbar-track {
  background: var(--bg)
}

::-webkit-scrollbar-thumb {
  background: var(--bar);
  border-radius: 6px;
  border: 3px solid var(--bg)
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent)
}
</style>
</head>
<body>
<main class="home" id="home">
  <div class="card">
    <span style="position:relative;z-index:1">coloque o Link para<br>abrir ele em<br>até 100 páginas</span>
  </div>
  <form id="f" autocomplete="off" novalidate>
    <input class="link" id="link" type="text" inputmode="url" placeholder="Ex: https://....." aria-label="Link">
    <div class="row">
      <label for="qtd">Páginas</label>
      <input class="qtd" id="qtd" type="number" min="1" max="100" value="72">
      <button class="btn" type="submit">Abrir</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<section id="view" hidden>
  <div class="bar">
    <button class="btn alt" id="back" type="button">← Voltar</button>
    <span class="info" id="info"></span>
    <button class="btn alt" id="tabs" type="button" title="Abre cada página em uma aba do navegador (libere pop-ups)">Abrir em abas</button>
  </div>
  <p class="bar" style="padding-top:0;opacity:.8">Se aparecer "conexão recusada", o site não permite ser exibido em janelas. Use "Abrir em abas".</p>
  <div class="grid" id="grid"></div>
</section>

<script>
var $ = function(id) {
  return document.getElementById(id)
};
var url = "", count = 0;

function norm(v) {
  v = v.trim();
  if (!v) return null;
  if (!/^https?:\/\//i.test(v)) v = "https://" + v;
  try {
    var u = new URL(v);
    return /^https?:$/.test(u.protocol) ? u.href : null
  } catch (e) {
    return null
  }
}

function embedUrl(u) {
  var m = u.match(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\/@[^\/]+\/video\/(\d+)/i);
  if (m) return "https://www.tiktok.com/embed/v2/" + m[1];
  var y = u.match(/^https?:\/\/(?:(?:www\.|m\.)?youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/i);
  return y ? "https://www.youtube.com/embed/" + y[1] : u;
}

function scale() {
  var c = document.querySelector(".cell");
  if (!c) return;
  $("grid").style.setProperty("--s", (c.clientWidth / 1280).toFixed(4));
}

function build() {
  var g = $("grid");
  g.textContent = "";
  for (var i = 0; i < count; i++) {
    var c = document.createElement("div");
    c.className = "cell";
    var f = document.createElement("iframe");
    f.src = embedUrl(url);
    f.title = "Página " + (i + 1);
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-popups-to-escape-sandbox");
    f.setAttribute("allow", "encrypted-media; fullscreen; picture-in-picture; autoplay");
    f.referrerPolicy = "strict-origin-when-cross-origin";
    c.appendChild(f);
    g.appendChild(c);
  }
  $("info").textContent = count + " páginas • " + url;
  $("home").hidden = true;
  $("view").hidden = false;
  scale();
  window.scrollTo(0, 0);
}

$("f").addEventListener("submit", function(e) {
  e.preventDefault();
  var u = norm($("link").value);
  var n = Math.min(100, Math.max(1, parseInt($("qtd").value, 10) || 72));
  if (!u) {
    $("err").textContent = "Link inválido. Exemplo: https://exemplo.com";
    return
  }
  $("err").textContent = "";
  url = u;
  count = n;
  build();
});

$("back").addEventListener("click", function() {
  $("grid").textContent = "";
  $("view").hidden = true;
  $("home").hidden = false;
});

$("tabs").addEventListener("click", function() {
  for (var i = 0; i < count; i++) window.open(url, "_blank", "noopener");
});

window.addEventListener("resize", scale);
</script>
</body>
</html>
