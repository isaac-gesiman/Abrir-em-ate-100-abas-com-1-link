<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abrir link em várias páginas</title>
<style>
:root{--bg:#fff;--fg:#111;--bar:#919191;--cell:#000;--line:#111;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--fg:#f2f2f2;--bar:#3a3a3d;--line:#f2f2f2}}
:root[data-theme="dark"]{--bg:#0e0e10;--fg:#f2f2f2;--bar:#3a3a3d;--line:#f2f2f2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Open Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
[hidden]{display:none!important}
.home{max-width:720px;margin:0 auto;padding:48px 16px;text-align:center}
.card{display:inline-block;border:4px solid var(--line);border-radius:22px;padding:22px 38px;font-size:clamp(18px,4.5vw,24px);line-height:1.25;margin-bottom:28px}
.link{display:block;width:100%;border:0;background:var(--bar);color:var(--fg);font:inherit;font-size:15px;text-align:center;padding:21px 12px;border-radius:0}
.link::placeholder{color:var(--fg);opacity:.85}
.link:focus-visible,.btn:focus-visible{outline:3px solid #2f7df6;outline-offset:2px}
.row{display:flex;gap:12px;justify-content:center;align-items:center;margin-top:18px;flex-wrap:wrap}
.qtd{width:84px;border:2px solid var(--line);background:transparent;color:var(--fg);font:inherit;padding:9px;text-align:center}
.btn{border:0;background:var(--fg);color:var(--bg);font:inherit;font-weight:600;padding:11px 26px;cursor:pointer}
.btn.alt{background:transparent;color:var(--fg);border:2px solid var(--line)}
.err{min-height:22px;margin-top:12px;color:#d33;font-size:14px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;font-size:13px}
.bar .info{flex:1;min-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .btn{padding:7px 14px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;padding:0 12px 16px}
@media (max-width:900px){.grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
.cell{background:var(--cell);aspect-ratio:2/1;overflow:hidden;position:relative}
.cell iframe{position:absolute;top:0;left:0;width:1280px;height:640px;border:0;background:#fff;transform:scale(var(--s,.1));transform-origin:0 0}
</style>
</head>
<body>
<main class="home" id="home">
  <div class="card">coloque o Link para<br>abrir ele em<br>até 100 páginas</div>
  <form id="f" autocomplete="off" novalidate>
    <input class="link" id="link" type="text" inputmode="url" placeholder="Ex: https://....." aria-label="Link">
    <div class="row">
      <label for="qtd">Páginas</label>
      <input class="qtd" id="qtd" type="number" min="1" max="100" value="72">
      <button class="btn" type="submit">Abrir</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<section id="view" hidden>
  <div class="bar">
    <button class="btn alt" id="back" type="button">Voltar</button>
    <span class="info" id="info"></span>
    <button class="btn alt" id="tabs" type="button" title="Abre cada página em uma aba do navegador (libere pop-ups)">Abrir em abas</button>
  </div>
  <p class="bar" style="padding-top:0;opacity:.8">Se aparecer "conexão recusada", o site não permite ser exibido em janelas. Use "Abrir em abas".</p>
  <div class="grid" id="grid"></div>
</section>

<script>
var $=function(id){return document.getElementById(id)};
var url="",count=0;
function norm(v){
  v=v.trim(); if(!v) return null;
  if(!/^https?:\/\//i.test(v)) v="https://"+v;
  try{var u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch(e){return null}
}
function embedUrl(u){
  var m=u.match(/^https?:\/\/(?:www\.|m\.)?tiktok\.com\/@[^\/]+\/video\/(\d+)/i);
  if(m) return "https://www.tiktok.com/embed/v2/"+m[1];
  var y=u.match(/^https?:\/\/(?:(?:www\.|m\.)?youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|live\/|embed\/)|youtu\.be\/)([\w-]{11})/i);
  return y?"https://www.youtube.com/embed/"+y[1]:u;
}
function scale(){
  var c=document.querySelector(".cell"); if(!c) return;
  $("grid").style.setProperty("--s",(c.clientWidth/1280).toFixed(4));
}
function build(){
  var g=$("grid"); g.textContent="";
  for(var i=0;i<count;i++){
    var c=document.createElement("div"); c.className="cell";
    var f=document.createElement("iframe");
    f.src=embedUrl(url); f.title="Página "+(i+1);
    f.setAttribute("sandbox","allow-scripts allow-same-origin allow-forms allow-popups allow-presentation allow-popups-to-escape-sandbox");
    f.setAttribute("allow","encrypted-media; fullscreen; picture-in-picture; autoplay");
    f.referrerPolicy="strict-origin-when-cross-origin";
    c.appendChild(f); g.appendChild(c);
  }
  $("info").textContent=count+" páginas • "+url;
  $("home").hidden=true; $("view").hidden=false;
  scale(); window.scrollTo(0,0);
}
$("f").addEventListener("submit",function(e){
  e.preventDefault();
  var u=norm($("link").value);
  var n=Math.min(100,Math.max(1,parseInt($("qtd").value,10)||72));
  if(!u){$("err").textContent="Link inválido. Exemplo: https://exemplo.com";return}
  $("err").textContent=""; url=u; count=n; build();
});
$("back").addEventListener("click",function(){
  $("grid").textContent=""; $("view").hidden=true; $("home").hidden=false;
});
$("tabs").addEventListener("click",function(){
  for(var i=0;i<count;i++) window.open(url,"_blank","noopener");
});
window.addEventListener("resize",scale);
</script>
</body>
</html>
